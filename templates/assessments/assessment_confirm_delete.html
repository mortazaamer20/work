{% extends "base.html" %}
{% block title %}حذف تقييم{% endblock %}
{% block page_title %}حذف تقييم{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
    <div class="card-body" style="text-align:center;">
        <i class="bi bi-exclamation-triangle" style="font-size:3rem;color:var(--danger);"></i>
        <h2 style="margin:16px 0 8px;">هل تريد حذف التقييم؟</h2>
        <p style="color:var(--gray-500);margin-bottom:24px;">{{ assessment.beneficiary.full_name }} - {{ assessment.date|date:"Y/m/d" }}</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-actions" style="justify-content:center;">
                <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> حذف</button>
                <a href="{% url 'assessments:list' %}" class="btn btn-outline">إلغاء</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
