{% extends "base.html" %}
{% block title %}تقرير مركز{% endblock %}
{% block page_title %}تقرير مركز - اختيار المركز{% endblock %}
{% block nav_reports %}active{% endblock %}
{% block content %}
<div class="card" style="max-width:600px;">
    <div class="card-body">
        <form method="get" action="{% url 'reports:center' %}">
            <div class="form-group">
                <label>اختر المركز</label>
                <select name="center" class="form-select" required>
                    <option value="">-- اختر مركزاً --</option>
                    {% for c in centers %}
                    <option value="{{ c.pk }}">{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-grid">
                <div class="form-group"><label>من تاريخ</label><input type="date" name="date_from" class="form-input"></div>
                <div class="form-group"><label>إلى تاريخ</label><input type="date" name="date_to" class="form-input"></div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="bi bi-bar-chart-line"></i> عرض التقرير</button>
                <a href="{% url 'reports:home' %}" class="btn btn-outline">العودة</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
