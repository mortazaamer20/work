{% extends "base.html" %}
{% block title %}تقرير فترة زمنية{% endblock %}
{% block page_title %}تقرير فترة زمنية{% endblock %}
{% block nav_reports %}active{% endblock %}
{% block content %}
<div class="card" style="max-width:600px;">
    <div class="card-body">
        <form method="get" action="{% url 'reports:period' %}">
            <div class="form-grid">
                <div class="form-group"><label>من تاريخ</label><input type="date" name="date_from" class="form-input" required></div>
                <div class="form-group"><label>إلى تاريخ</label><input type="date" name="date_to" class="form-input" required></div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="bi bi-calendar-range"></i> عرض التقرير</button>
                <a href="{% url 'reports:home' %}" class="btn btn-outline">العودة</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
