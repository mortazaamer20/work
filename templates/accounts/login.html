{% load static %}<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - مجمع التأهيل</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #0e7490 0%, #164e63 100%); }
        .login-card { background: #fff; border-radius: 16px; box-shadow: var(--shadow-lg); padding: 40px; width: 100%; max-width: 420px; }
        .login-logo { text-align: center; margin-bottom: 32px; }
        .login-logo .icon { width: 64px; height: 64px; background: var(--primary); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; margin-bottom: 12px; }
        .login-logo h1 { font-size: 1.4rem; color: var(--gray-800); }
        .login-logo p { font-size: 0.85rem; color: var(--gray-500); }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-logo">
        <div class="icon"><i class="bi bi-heart-pulse"></i></div>
        <h1>مجمع التأهيل</h1>
        <p>نظام إدارة المستفيدين والتقييمات</p>
    </div>
    {% if form.errors %}
    <div class="alert alert-error"><i class="bi bi-exclamation-circle"></i> اسم المستخدم أو كلمة المرور غير صحيحة</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">اسم المستخدم</label>
            <input type="text" name="username" id="id_username" class="form-input" placeholder="أدخل اسم المستخدم" autofocus required>
        </div>
        <div class="form-group">
            <label for="id_password">كلمة المرور</label>
            <input type="password" name="password" id="id_password" class="form-input" placeholder="أدخل كلمة المرور" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;">
            <i class="bi bi-box-arrow-in-left"></i> تسجيل الدخول
        </button>
    </form>
</div>
</body>
</html>
